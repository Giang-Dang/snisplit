[workspace]
resolver = "3"
members = ["crates/core", "crates/backend-windows", "crates/relay", "crates/cli"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Giang-Dang/snisplit"
publish = false

[workspace.dependencies]
snisplit-core = { path = "crates/core" }
snisplit-relay = { path = "crates/relay" }
tokio = { version = "1.54.1", default-features = false, features = ["rt-multi-thread", "net", "time", "signal", "io-util", "sync"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
