[workspace]
resolver = "3"
members = ["crates/core", "crates/backend-windows", "crates/cli"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Giang-Dang/snisplit"
publish = false

[workspace.dependencies]
snisplit-core = { path = "crates/core" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
