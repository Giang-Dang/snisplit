[package]
name = "snisplit-gui"
description = "Desktop window for snisplit: start and stop the relay, add and remove sites."
version.workspace = true
edition.workspace = true
rust-version = "1.95"
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
snisplit = { path = "../cli" }
snisplit-core.workspace = true
snisplit-relay.workspace = true
tokio.workspace = true

[target.'cfg(windows)'.dependencies]
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts"] }

[[bin]]
name = "snisplit-gui"
path = "src/main.rs"
test = false

[lints]
workspace = true
