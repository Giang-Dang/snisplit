name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version without the leading v; must equal the workspace version in Cargo.toml
        required: true
  push:
    branches: ['ci/release*']

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  windows:
    name: Windows x86_64 archive
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install stable --profile minimal
      - name: Read the workspace version
        id: version
        env:
          REQUESTED: ${{ inputs.version }}
        run: |
          $workspace = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages | Where-Object name -eq 'snisplit' | ForEach-Object version
          if ($env:REQUESTED -and $env:REQUESTED -ne $workspace) { throw "requested $env:REQUESTED but Cargo.toml says $workspace" }
          "value=$workspace" >> $env:GITHUB_OUTPUT
      - run: cargo test --workspace --release
      - run: cargo build --workspace --release
      - name: Assemble the archive
        id: archive
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          $name = "snisplit-$env:VERSION-windows-x86_64"
          New-Item -ItemType Directory $name | Out-Null
          $binaries = @(Get-ChildItem target/release -Filter 'snisplit*.exe')
          if ($binaries.Count -eq 0) { throw 'no snisplit executable was built' }
          $binaries | Copy-Item -Destination $name
          Copy-Item README.md, LICENSE-MIT, LICENSE-APACHE -Destination $name
          Compress-Archive -Path $name -DestinationPath "$name.zip"
          $hash = (Get-FileHash "$name.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  $name.zip" | Set-Content -Encoding ascii "$name.zip.sha256"
          Get-ChildItem $name | Format-Table Name, Length
          Get-Content "$name.zip.sha256"
          "name=$name" >> $env:GITHUB_OUTPUT
      - name: Build the installer
        env:
          VERSION: ${{ steps.version.outputs.value }}
          NAME: ${{ steps.archive.outputs.name }}
        run: |
          dotnet build installer/snisplit.wixproj -c Release "-p:ProductVersion=$env:VERSION"
          if ($LASTEXITCODE -ne 0) { throw 'the installer build failed' }
          Copy-Item "target/installer/bin/Release/$env:NAME.msi" -Destination .
          $hash = (Get-FileHash "$env:NAME.msi" -Algorithm SHA256).Hash.ToLower()
          "$hash  $env:NAME.msi" | Set-Content -Encoding ascii "$env:NAME.msi.sha256"
          Get-Content "$env:NAME.msi.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.archive.outputs.name }}
          path: |
            ${{ steps.archive.outputs.name }}.zip
            ${{ steps.archive.outputs.name }}.zip.sha256
            ${{ steps.archive.outputs.name }}.msi
            ${{ steps.archive.outputs.name }}.msi.sha256
      - name: Create the draft release
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.value }}
          NAME: ${{ steps.archive.outputs.name }}
        run: gh release create "v$env:VERSION" "$env:NAME.zip" "$env:NAME.zip.sha256" "$env:NAME.msi" "$env:NAME.msi.sha256" --draft --target $env:GITHUB_SHA --title "snisplit $env:VERSION" --generate-notes

  linux:
    name: Linux x86_64 archive
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install stable --profile minimal --target x86_64-unknown-linux-musl
      - name: Read the workspace version
        id: version
        env:
          REQUESTED: ${{ inputs.version }}
        run: |
          workspace=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "snisplit") | .version')
          if [ -n "$REQUESTED" ] && [ "$REQUESTED" != "$workspace" ]; then echo "requested $REQUESTED but Cargo.toml says $workspace"; exit 1; fi
          echo "value=$workspace" >> "$GITHUB_OUTPUT"
      - run: cargo test --workspace --release
      - run: cargo build --release -p snisplit --target x86_64-unknown-linux-musl
      - name: Assemble the archive
        id: archive
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          name="snisplit-$VERSION-linux-x86_64"
          mkdir "$name"
          cp target/x86_64-unknown-linux-musl/release/snisplit README.md LICENSE-MIT LICENSE-APACHE "$name/"
          tar -czf "$name.tar.gz" "$name"
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
          ls -l "$name"
          cat "$name.tar.gz.sha256"
          echo "name=$name" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.archive.outputs.name }}
          path: |
            ${{ steps.archive.outputs.name }}.tar.gz
            ${{ steps.archive.outputs.name }}.tar.gz.sha256
      - name: Add the archive to the draft release
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.value }}
          NAME: ${{ steps.archive.outputs.name }}
        run: gh release upload "v$VERSION" "$NAME.tar.gz" "$NAME.tar.gz.sha256"
